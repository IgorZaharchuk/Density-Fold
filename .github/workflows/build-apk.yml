name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Android SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest --stacktrace

    - name: Run Android Lint
      run: ./gradlew :app:lintDebug --stacktrace

    - name: Upload Android Lint report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Android-Lint-Report
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.txt
          app/build/reports/lint-results-debug.sarif
        if-no-files-found: warn
        retention-days: 7

    - name: Build with Gradle
      run: |
        VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
        if [ -z "$VERSION_NAME" ]; then
          echo "Не удалось определить versionName из app/build.gradle.kts"
          exit 1
        fi
        echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

        ./gradlew :app:assembleDebug --stacktrace
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        cp "$APK_PATH" "app/build/outputs/apk/debug/Density-Fold-Direct-API27-$VERSION_NAME.apk"
        echo "APK_PATH=app/build/outputs/apk/debug/Density-Fold-Direct-API27-$VERSION_NAME.apk" >> "$GITHUB_ENV"
        echo "ARTIFACT_NAME=Density-Fold-Direct-API27-$VERSION_NAME" >> "$GITHUB_ENV"
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.APK_PATH }}
        retention-days: 30