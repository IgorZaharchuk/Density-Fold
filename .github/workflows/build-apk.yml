name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Android SDK components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
    - name: Build with Gradle
      run: |
        VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
        if [ -z "$VERSION_NAME" ]; then
          echo "Не удалось определить versionName из app/build.gradle.kts"
          exit 1
        fi
        echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
        ./gradlew :app:assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Density-Fold-$VERSION_NAME.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Density-Fold-${{ env.VERSION_NAME }}
        path: app/build/outputs/apk/debug/Density-Fold-${{ env.VERSION_NAME }}.apk
        retention-days: 30
